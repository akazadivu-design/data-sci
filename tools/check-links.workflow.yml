name: Check internal links

on:
  push:
    paths:
      - "**/*.md"
      - "tools/check_links.py"
  pull_request:
    paths:
      - "**/*.md"
      - "tools/check_links.py"

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate internal markdown links and anchors
        run: python tools/check_links.py
